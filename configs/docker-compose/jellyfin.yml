services:
  jellyfin:
    image: jellyfin/jellyfin@sha256:baba630419915985442f315f08b0cf46d9f4c8a0cc4bd38e94a6d35751dd5ef5
    container_name: jellyfin
    restart: unless-stopped
    volumes:
      - /mnt/hdd-music/music:/media/music
      - /mnt/hdd-media/videos/movies:/media/movies
      - /mnt/hdd-media/videos/tv:/media/tv
      - /mnt/hdd-media/videos/anime:/media/anime
      - jellyfin_config:/config
    ports:
      - "8096:8096"
    tmpfs:
      - /transcode:size=8G
    # Uncomment if hardware transcoding becomes available (Intel Quick Sync)
    devices:
      - /dev/dri:/dev/dri
    networks:
      - shared_net

volumes:
  jellyfin_config:

networks:
  shared_net:
    external: true
