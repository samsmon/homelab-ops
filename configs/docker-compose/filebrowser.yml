services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    user: 0:0
    volumes:
    - /mnt/hdd-cloud:/srv/HDD-Cloud
    - /mnt/hdd-media:/srv/HDD-Media
    - /mnt/hdd-music:/srv/HDD-Music
    - /opt/infra/filebrowser/filebrowser.db:/database/filebrowser.db
    networks:
    - shared_net
    command: --auth.method=proxy --auth.header=Remote-User
  filebrowser-proxy:
    image: nginx:alpine
    container_name: filebrowser-proxy
    restart: unless-stopped
    ports:
    - 8085:80
    volumes:
    - ./sso-sidecars/filebrowser.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
    - filebrowser
    networks:
    - shared_net
networks:
  shared_net:
    external: true
