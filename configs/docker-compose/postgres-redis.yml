version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: shared-postgres
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c maintenance_work_mem=512MB
      -c work_mem=32MB
      -c max_connections=200
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # set in .env, never commit the real value
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - shared_net
    ports:
      - "127.0.0.1:5432:5432"  # bind to localhost only, not exposed externally

  redis:
    image: redis:7-alpine
    container_name: shared-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - shared_net
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
  redis_data:

networks:
  shared_net:
    external: true
