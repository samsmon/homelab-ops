services:
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    restart: unless-stopped
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf
    ports:
      # DNS ports
      - "53:53/tcp"
      - "53:53/udp"
      # Web UI port (80 is taken by NPM, 8085 is taken by filebrowser — 3000 is free and is what AdGuard's own setup wizard defaults to)
      - "3000:3000/tcp"
    networks:
      - shared_net

volumes:
  adguard_work:
  adguard_conf:

networks:
  shared_net:
    external: true
