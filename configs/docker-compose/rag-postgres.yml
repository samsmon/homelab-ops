# RAG database (pgvector) on dev-host (LXC 102). Deployed at /opt/projects/rag-postgres/docker-compose.yml.
# Published only on the Tailscale IP; password lives in /opt/projects/rag-postgres/.env (not in git).
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rag
    ports:
      - "100.73.165.64:5433:5432"
    volumes:
      - ragdata:/var/lib/postgresql/data
    mem_limit: 5g
    cpus: 2
    shm_size: 256m
volumes:
  ragdata:
