services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: host  # switched 2026-09-22 from shared_net bridge: the container needs the LXC's real
      # global IPv6 address directly (ISP is behind CGNAT for IPv4, so IPv6 is the only path for inbound
      # peer connections) — Docker's bridge network has no IPv6 of its own, so qBittorrent couldn't
      # advertise a reachable address to trackers/peers even though inbound port-forwarding "worked"
      # (that was just docker-proxy's IPv4 NAT translating in, invisible to the app itself)
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Jakarta
      WEBUI_PORT: "8480"
      TORRENTING_PORT: "6881"
    volumes:
      - qbittorrent_config:/config
      - /mnt/hdd-media/qbittorrent/downloads:/downloads
      - /mnt/hdd-media/qbittorrent/watch-torrents:/watch-torrents
    dns:
      - 1.1.1.1
      - 8.8.8.8
      # host networking means this container inherits the LXC's /etc/resolv.conf, which points at
      # Tailscale's MagicDNS (100.100.100.100) — that resolver couldn't resolve normal internet
      # hostnames (trackers, etc.), which silently broke every torrent (stalled with no error visible
      # in qBittorrent itself). Override with public DNS since this container has no need for
      # Tailscale-scoped hostnames.
    stop_grace_period: "10s"  # let it save resume data on shutdown

volumes:
  qbittorrent_config:
    external: true
