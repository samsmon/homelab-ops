services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: Asia/Jakarta
      WEBUI_PORT: '8480'
      TORRENTING_PORT: '6881'
    volumes:
    - qbittorrent_config:/config
    - /mnt/hdd-media/qbittorrent/downloads:/downloads
    ports:
    - 6881:6881
    - 6881:6881/udp
    stop_grace_period: 10s
    networks:
    - shared_net
  qbittorrent-proxy:
    image: nginx:alpine
    container_name: qbittorrent-proxy
    restart: unless-stopped
    ports:
    - 8480:80
    volumes:
    - ./sso-sidecars/qbittorrent.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
    - qbittorrent
    networks:
    - shared_net
volumes:
  qbittorrent_config: null
networks:
  shared_net:
    external: true
