services:
  t3code:
    image: t3code-custom:latest
    container_name: t3code
    restart: unless-stopped
    init: true
    ports:
      - "9001:9000"
    environment:
      - IS_SANDBOX=1
      - 'T3_TITLE=T3 Code (dev-host)'
    mem_limit: 11g
    cpus: 3.5
    volumes:
      # Map the root directory to persist claude and t3 config/auth
      - t3code_data:/root
      # Map projects directory so agents can work on them
      - /workspace:/workspace

volumes:
  t3code_data:
    external: true
