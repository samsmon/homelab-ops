services:
  feishin:
    image: ghcr.io/jeffvli/feishin:latest
    container_name: feishin
    restart: unless-stopped
    environment:
    - SERVER_NAME=Navidrome
    - SERVER_TYPE=navidrome
    - SERVER_URL=http://192.168.18.225:4533
    - SERVER_LOCK=false
    networks:
    - shared_net
  feishin-proxy:
    image: nginx:alpine
    container_name: feishin-proxy
    restart: unless-stopped
    ports:
    - 9180:80
    volumes:
    - ./sso-sidecars/feishin.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
    - feishin
    networks:
    - shared_net
networks:
  shared_net:
    external: true
