services:
  stream-vault:
    build:
      context: /mnt/homelab_projects/stream-vault
      dockerfile: Dockerfile
    container_name: stream-vault
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - NODE_ENV=production
      - PORT=8090
      - HOST=0.0.0.0
      - MEDIA_ROOT=/media
      - LOG_LEVEL=info
    volumes:
      # Real homelab media root mounted read-only
      # Contains anime/, movies/, tv/
      - /mnt/hdd-media/jellyfin:/media:ro
      - stream-vault-cache:/app/.cache
    networks:
      - shared_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  stream-vault-cache:

networks:
  shared_net:
    external: true
