services:
  stream-vault:
    build:
      context: /mnt/homelab_projects/stream-vault
      dockerfile: Dockerfile
    container_name: stream-vault
    restart: unless-stopped
    init: true
    pids_limit: 100
    environment:
    - NODE_ENV=production
    - PORT=8090
    - HOST=0.0.0.0
    - MEDIA_ROOT=/media
    - LOG_LEVEL=info
    - FFMPEG_MAX_CONCURRENCY=1
    - FFMPEG_TIMEOUT_MS=15000
    volumes:
    - /mnt/hdd-media/jellyfin:/media:ro
    - stream-vault-cache:/app/.cache
    - stream-vault-data:/app/server/data
    networks:
    - shared_net
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:8090/api/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 100
        reservations:
          memory: 128M
  stream-vault-proxy:
    image: nginx:alpine
    container_name: stream-vault-proxy
    restart: unless-stopped
    ports:
    - 8090:80
    volumes:
    - ./sso-sidecars/stream-vault.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
    - stream-vault
    networks:
    - shared_net
volumes:
  stream-vault-cache: null
  stream-vault-data: null
networks:
  shared_net:
    external: true
