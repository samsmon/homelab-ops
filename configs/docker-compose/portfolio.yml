services:
  portfolio:
    build: .
    container_name: portofolio
    restart: unless-stopped
    networks:
    - shared_net
  portfolio-proxy:
    image: nginx:alpine
    container_name: portfolio-proxy
    restart: unless-stopped
    ports:
    - 3080:80
    volumes:
    - ./sso-sidecars/portfolio.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
    - portfolio
    networks:
    - shared_net
networks:
  shared_net:
    external: true
