<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>malas - admin series index: tampilan card (mockup)</title>
<style>
:root{--s1:#f6f5f1;--s2:#fff;--tx:#1a1a18;--tx2:#5f5e5a;--tx3:#888780;--bd:rgba(0,0,0,.12);--bd2:rgba(0,0,0,.28);--acc:#185fa5;--accbg:#e6f1fb;--acctx:#0c447c;--wbg:#faeeda;--wtx:#633806;--gbg:#eaf3de;--gtx:#27500a;--rbg:#fceBEB;--rtx:#a32d2d;--pbg:#eeedfe;--ptx:#3c3489}
@media(prefers-color-scheme:dark){:root{--s1:#2a2a28;--s2:#1f1f1d;--tx:#f1efe8;--tx2:#b4b2a9;--tx3:#888780;--bd:rgba(255,255,255,.15);--bd2:rgba(255,255,255,.3);--acc:#85b7eb;--accbg:#042c53;--acctx:#b5d4f4;--wbg:#412402;--wtx:#faeeda;--gbg:#173404;--gtx:#c0dd97;--rbg:#501313;--rtx:#f09595;--pbg:#26215c;--ptx:#cecbf6}}
body{font-family:system-ui,sans-serif;background:var(--s2);color:var(--tx);margin:0;padding:16px;max-width:1000px;font-size:14px}
button,input,select{font:inherit;color:inherit;background:transparent;border:.5px solid var(--bd2);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.row1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.seg{display:flex;flex-wrap:wrap;margin-bottom:12px}
.seg button{border-radius:0;margin-left:-.5px;padding:4px 12px;font-size:13px}
.seg button:first-child{border-radius:8px 0 0 8px;margin-left:0}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{background:var(--s1);font-weight:500}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}
@media(max-width:480px){.list{grid-template-columns:1fr}}
.card{position:relative;display:flex;gap:12px;padding:10px;border:.5px solid var(--bd2);border-radius:12px;background:var(--s2);cursor:pointer}
.card:hover{background:var(--s1)}
.card.sl{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.cv{flex:none;width:96px;height:144px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:500;overflow:hidden;font-size:22px}
.inf{flex:1;min-width:0;display:flex;flex-direction:column}
.ck{position:absolute;top:10px;right:10px}
.t{font-weight:500;padding-right:28px;line-height:1.3}
.e{font-size:12px;color:var(--tx2);margin-top:2px}
.bgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bg{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.meta{display:flex;gap:16px;margin-top:10px;font-size:13px;color:var(--tx2)}
.meta b{color:var(--tx);font-weight:500}
.pg{height:4px;border-radius:2px;background:var(--bd);margin-top:4px;overflow:hidden;width:90px}.pg i{display:block;height:100%;background:var(--gtx)}
.act{display:flex;gap:6px;margin-top:auto;padding-top:10px}
.act button{font-size:12px;padding:4px 10px}
.act .mo{margin-left:auto;padding:4px 10px}
.tag{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--pbg);color:var(--ptx);margin-left:4px;vertical-align:1px}
.menu{position:absolute;right:10px;bottom:44px;background:var(--s2);border:.5px solid var(--bd2);border-radius:8px;padding:4px;z-index:3;min-width:190px}
.menu div{padding:6px 10px;border-radius:6px;cursor:pointer}.menu div:hover{background:var(--s1)}
.bulk{display:none;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;margin-top:12px;border:.5px solid var(--bd2);border-radius:10px;position:sticky;bottom:8px;background:var(--s2)}
.note{font-size:12px;color:var(--tx3);margin:12px 0 0;line-height:1.6}
.empty{padding:40px;text-align:center;color:var(--tx2);grid-column:1/-1}
</style></head><body>
<div class="top">
<div><b>Admin / Series</b> <span style="color:var(--tx2)" id="cnt"></span></div>
<button style="background:var(--tx);color:var(--s2)">+ Tambah series</button>
</div>
<div class="row1"><input type="text" id="q" placeholder="Cari judul" style="width:220px"><button aria-label="Refresh" title="Refresh">&#8635;</button>
<select id="st"><option value="">Semua status</option><option value="publishing">Berlangsung</option><option value="finished">Tamat</option><option value="on_hiatus">Hiatus</option><option value="discontinued">Dihentikan</option><option value="not_yet_published">Belum terbit</option></select>
<label style="font-size:13px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="all"> Pilih semua</label></div>
<div class="seg" id="ty"><button data-v="" class="on">Semua tipe</button><button data-v="manga">Manga</button><button data-v="novel">Light novel</button><button data-v="one_shot">One shot</button><button data-v="doujinshi">Doujinshi</button><button data-v="other">Lainnya</button></div>
<div class="list" id="l"></div>
<div class="bulk" id="bk"></div>
<p class="note">Data contoh. Filter status dan tipe, field kartu (judul, judul Inggris, tipe, status, volume n/total, skor) mengikuti <code>Admin/Series/Index.tsx</code> di repo malas. Fitur tambah volume dihapus dari desain. Label "usulan" menandai yang belum ada di kode.</p>
<script>
var C=[["#E6F1FB","#0C447C"],["#FAECE7","#712B13"],["#E1F5EE","#085041"],["#EEEDFE","#3C3489"],["#FBEAF0","#72243E"],["#FAEEDA","#633806"]];
var SL={publishing:"Berlangsung",finished:"Tamat",on_hiatus:"Hiatus",discontinued:"Dihentikan",not_yet_published:"Belum terbit"};
var TL={manga:"Manga",novel:"Light novel",one_shot:"One shot",doujinshi:"Doujinshi",other:"Lainnya"};
var SC={publishing:["var(--accbg)","var(--acctx)"],finished:["var(--gbg)","var(--gtx)"],on_hiatus:["var(--wbg)","var(--wtx)"],discontinued:["var(--rbg)","var(--rtx)"],not_yet_published:["var(--s1)","var(--tx2)"]};
var R=[["Sousou no Frieren","Frieren: Beyond Journey's End","manga","publishing",14,null,8.9,1],["Dungeon Meshi","Delicious in Dungeon","manga","finished",14,14,8.8,1],["Blue Period","","manga","publishing",9,15,8.1,1],["Vinland Saga","","manga","publishing",27,null,9.0,1],["Spy x Family","","manga","publishing",11,14,8.6,1],["Oshi no Ko","[Oshi no Ko]","manga","finished",16,16,8.4,0],["Mushishi","","manga","finished",10,10,8.7,1],["Monster","","manga","finished",12,18,9.1,1],["Kono Light Novel","","novel","publishing",5,12,7.6,0],["Hoshi no Ichiya","","one_shot","finished",1,1,null,1]].map(function(r,i){return{id:i,t:r[0],e:r[1],ty:r[2],st:r[3],h:r[4],tot:r[5],sc:r[6],cov:r[7],c:C[i%6]}});
var sel={},ty="",menu=null;
function closeM(){menu=null;document.querySelectorAll('.menu').forEach(function(m){m.remove()})}
function draw(){
var q=document.getElementById('q').value.toLowerCase(),st=document.getElementById('st').value;
var d=R.filter(function(s){return s.t.toLowerCase().indexOf(q)>-1&&(!st||s.st===st)&&(!ty||s.ty===ty)});
document.getElementById('cnt').textContent="- "+d.length+" series";
document.getElementById('all').checked=d.length>0&&d.every(function(s){return sel[s.id]});
var l=document.getElementById('l');l.innerHTML='';
if(!d.length)l.innerHTML='<div class="empty">Tidak ada series.</div>';
d.forEach(function(s){
var c=document.createElement('div');c.className='card'+(sel[s.id]?' sl':'');
var cv=s.cov?'<div class="cv" style="background:'+s.c[0]+';color:'+s.c[1]+'">'+s.t.charAt(0)+'</div>':'<div class="cv" style="background:var(--bd);color:var(--tx3);font-size:11px">Tanpa cover</div>';
c.innerHTML=cv+'<div class="inf"><input type="checkbox" class="ck" '+(sel[s.id]?'checked':'')+' aria-label="Pilih '+s.t+'"><div class="t">'+s.t+'</div>'+(s.e?'<div class="e">'+s.e+'</div>':'')+'<div class="bgs"><span class="bg" style="background:var(--s1);color:var(--tx2);border:.5px solid var(--bd)">'+TL[s.ty]+'</span><span class="bg" style="background:'+SC[s.st][0]+';color:'+SC[s.st][1]+'">'+SL[s.st]+'</span></div><div class="meta"><div>Volume<br><b>'+s.h+(s.tot?'/'+s.tot:'')+'</b>'+(s.tot?'<div class="pg"><i style="width:'+Math.round(s.h/s.tot*100)+'%"></i></div>':'')+'</div><div>Skor<br><b>'+(s.sc!==null?s.sc.toFixed(1):'-')+'</b></div></div><div class="act"><button data-a="e">Edit</button><button data-a="t">Tab baru</button><button class="mo" data-m="1" aria-label="Menu lainnya">...</button></div></div>';
var cb=c.querySelector('.ck');cb.onclick=function(e){e.stopPropagation()};cb.onchange=function(e){if(e.target.checked)sel[s.id]=1;else delete sel[s.id];draw();bulk()};
c.querySelector('.act').onclick=function(e){e.stopPropagation()};
c.querySelector('[data-m]').onclick=function(e){e.stopPropagation();var o=menu===s.id;closeM();if(!o){menu=s.id;var m=document.createElement('div');m.className='menu';m.innerHTML='<div>Lihat detail</div><div>Ganti cover <span class="tag">usulan</span></div><div>Cari ulang metadata <span class="tag">usulan</span></div><div style="color:var(--rtx)">Hapus</div>';c.appendChild(m)}};
l.appendChild(c)})}
function bulk(){var n=Object.keys(sel).length,k=document.getElementById('bk');k.style.display=n?'flex':'none';
k.innerHTML='<b>'+n+' dipilih</b><button>Ubah status <span class="tag">usulan</span></button><button>Cari ulang metadata <span class="tag">usulan</span></button><button style="color:var(--rtx)">Hapus '+n+'</button><button id="bx2" style="margin-left:auto" aria-label="Batal pilih">x</button>';
document.getElementById('bx2').onclick=function(){sel={};draw();bulk()}}
document.getElementById('all').onchange=function(e){var q=document.getElementById('q').value.toLowerCase(),st=document.getElementById('st').value;R.filter(function(s){return s.t.toLowerCase().indexOf(q)>-1&&(!st||s.st===st)&&(!ty||s.ty===ty)}).forEach(function(s){if(e.target.checked)sel[s.id]=1;else delete sel[s.id]});draw();bulk()};
document.getElementById('q').oninput=draw;document.getElementById('st').onchange=draw;
document.querySelectorAll('#ty button').forEach(function(x){x.onclick=function(){ty=x.dataset.v;document.querySelectorAll('#ty button').forEach(function(y){y.classList.toggle('on',y===x)});draw()}});
document.addEventListener('click',closeM);
draw();
</script></body></html>
