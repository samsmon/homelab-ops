# sync-config.conf — defines what gets synced from Master (hdd-backup) to each target drive.
# Used by scripts/sync-from-master.sh. Edit this file to add/remove curated folders — no need
# to touch the sync script itself.
#
# Format (pipe-separated, one per line):
#   MEDIA_TYPE|MASTER_PATH|TARGET_PATH
#
# MEDIA_TYPE is just a label used in logs/reports (music, video, manga, ...).
# Lines starting with # are comments. Blank lines are ignored.
#
# To curate: add only the specific subfolder(s) you want streamable on the target drive.
# To full-mirror: point MASTER_PATH and TARGET_PATH at the top-level folder.

# --- Music: curated subset only (hdd-music is smaller than hdd-backup on purpose) ---
music|/mnt/hdd-backup/music/Lossless|/mnt/hdd-music/music/Lossless

# --- Video: full mirror (Jellyfin needs the whole library) ---
video|/mnt/hdd-backup/videos|/mnt/hdd-media/videos

# --- Manga: full mirror (manga-optimizer.py on hdd-media watches this path and
#     generates the WebP-optimized manga-reader library for Komga from it) ---
manga|/mnt/hdd-backup/manga-raw|/mnt/hdd-media/manga-raw
